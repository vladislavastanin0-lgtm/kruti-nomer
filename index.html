<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крути Номера</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1c1e24;
            --accent-gold: #f39c12;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        /* Шапка */
        .header {
            width: 100%;
            padding: 12px 16px;
            box-sizing: border-box;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2d34;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand-title {
            font-size: 1rem;
            font-weight: 700;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .balance-badge {
            background: #2a2d34;
            padding: 6px 10px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
            color: var(--accent-green);
        }

        .donate-btn {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            border: none;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .donate-btn:active {
            transform: scale(0.95);
        }

        /* Навигация */
        .nav-tabs {
            display: flex;
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-bottom: 1px solid #2a2d34;
            overflow-x: auto;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 6px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
        }

        .tab-btn.active {
            color: var(--accent-gold);
            border-bottom-color: var(--accent-gold);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 16px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Карточка рулетки */
        .game-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #2a2d34;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .car-display {
            font-size: 3.5rem;
            margin: 10px 0 5px 0;
        }

        .car-title {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .number-plate {
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 15px 0;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .save-btn {
            background-color: var(--accent-green);
            color: white;
            border: none;
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .action-btn:active, .save-btn:active {
            opacity: 0.85;
        }

        /* Списки */
        .item-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .list-item {
            background: var(--card-bg);
            border: 1px solid #2a2d34;
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .small-plate {
            background: #fff;
            color: #000;
            border: 2px solid #000;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1rem;
        }

        .sell-btn {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .buy-btn {
            background: var(--accent-green);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .select-btn {
            background: var(--accent-blue);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="brand-title">🏎️ Крути Номера</div>
        <div class="stats-bar">
            <div class="balance-badge" id="balanceDisplay">💵 $2,000</div>
            <button class="donate-btn" onclick="buyWithStars('Поддержка проекта', 'Зачисление $50,000 в игре', 50)">
                ⭐ 50 Stars
            </button>
        </div>
    </div>

    <!-- МЕНЮ ВКЛАДОК -->
    <div class="nav-tabs">
        <button class="tab-btn active" id="tab-game" onclick="switchTab('game')">🎲 Рулетка</button>
        <button class="tab-btn" id="tab-plates" onclick="switchTab('plates')">📋 Мои Номера</button>
        <button class="tab-btn" id="tab-garage" onclick="switchTab('garage')">🚗 Гараж</button>
        <button class="tab-btn" id="tab-shop" onclick="switchTab('shop')">🏪 Автосалон</button>
    </div>

    <!-- КОНТЕНТ -->
    <div class="container">
        
        <!-- РУЛЕТКА -->
        <div id="gameTab" class="tab-content active">
            <div class="game-card">
                <div class="car-display" id="currentCarIcon">🚗</div>
                <div class="car-title" id="currentCarName">ВАЗ 2107</div>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 2px;">Текущий авто</p>

                <div class="number-plate" id="plateDisplay">777 AAA 01</div>

                <p id="spinReward" style="color: var(--accent-gold); font-weight: bold; min-height: 20px; font-size: 0.9rem;"></p>

                <div class="btn-group">
                    <button class="action-btn" onclick="spinPlate()">Крутить ($100)</button>
                    <button class="save-btn" onclick="saveCurrentPlate()">В инвентарь</button>
                </div>
            </div>
        </div>

        <!-- МОИ НОМЕРА (ПРОДАЖА) -->
        <div id="platesTab" class="tab-content">
            <h3 style="margin: 0 0 5px 0;">Мои номера</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0;">Продавайте номера по своей цене</p>
            <div class="item-list" id="platesList"></div>
        </div>

        <!-- ГАРАЖ -->
        <div id="garageTab" class="tab-content">
            <h3 style="margin: 0 0 5px 0;">Мой гараж</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0;">Выберите авто для игры</p>
            <div class="item-list" id="garageList"></div>
        </div>

        <!-- АВТОСАЛОН -->
        <div id="shopTab" class="tab-content">
            <h3 style="margin: 0 0 5px 0;">Автосалон</h3>
            <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0;">Покупайте новые машины</p>
            <div class="item-list" id="shopList"></div>
        </div>

    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        const BOT_TOKEN = "8977809186:AAF0fqobqVRQf8wbnwApirFl_dwSrHZvxPc";

        const cars = [
            { id: 0, name: "ВАЗ 2107", icon: "🚗", price: 0 },
            { id: 1, name: "Toyota Camry", icon: "🚘", price: 5000 },
            { id: 2, name: "BMW M5", icon: "🏎️", price: 25000 },
            { id: 3, name: "Mercedes G63 AMG", icon: "🚙", price: 75000 },
            { id: 4, name: "Porsche 911", icon: "🏎️", price: 200000 },
            { id: 5, name: "Bugatti Chiron", icon: "🏎️", price: 1000000 }
        ];

        // Инициализация баланса 2000 монет по умолчанию
        let balance = parseInt(localStorage.getItem('balance'));
        if (isNaN(balance)) {
            balance = 2000;
        }

        let ownedCars = JSON.parse(localStorage.getItem('ownedCars')) || [0];
        let currentCarIndex = parseInt(localStorage.getItem('currentCarIndex')) || 0;
        let myPlates = JSON.parse(localStorage.getItem('myPlates')) || [];
        let lastGeneratedPlate = "777 AAA 01";
        let lastEstimatedValue = 5000;

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = `💵 $${balance.toLocaleString()}`;
            document.getElementById('currentCarIcon').innerText = cars[currentCarIndex].icon;
            document.getElementById('currentCarName').innerText = cars[currentCarIndex].name;
            
            localStorage.setItem('balance', balance);
            localStorage.setItem('ownedCars', JSON.stringify(ownedCars));
            localStorage.setItem('currentCarIndex', currentCarIndex);
            localStorage.setItem('myPlates', JSON.stringify(myPlates));

            renderPlates();
            renderGarage();
            renderShop();
        }

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            if (tabName === 'game') {
                document.getElementById('gameTab').classList.add('active');
                document.getElementById('tab-game').classList.add('active');
            } else if (tabName === 'plates') {
                document.getElementById('platesTab').classList.add('active');
                document.getElementById('tab-plates').classList.add('active');
            } else if (tabName === 'garage') {
                document.getElementById('garageTab').classList.add('active');
                document.getElementById('tab-garage').classList.add('active');
            } else if (tabName === 'shop') {
                document.getElementById('shopTab').classList.add('active');
                document.getElementById('tab-shop').classList.add('active');
            }
        }

        function spinPlate() {
            if (balance < 100) {
                alert("Недостаточно денег для прокрутки! Нужно $100");
                return;
            }

            balance -= 100;

            const letters = "ABEKMHOPCTYX";
            const numbers = Math.floor(100 + Math.random() * 900);
            const randLetters = letters[Math.floor(Math.random() * letters.length)] +
                                letters[Math.floor(Math.random() * letters.length)] +
                                letters[Math.floor(Math.random() * letters.length)];
            const regions = ["01", "02", "05", "13", "17", "777"];
            const region = regions[Math.floor(Math.random() * regions.length)];

            lastGeneratedPlate = `${numbers} ${randLetters} ${region}`;
            document.getElementById("plateDisplay").innerText = lastGeneratedPlate;

            lastEstimatedValue = 50;
            let rewardText = "Обычный номер (Оценка: $50)";

            if (numbers === 777 || numbers === 111 || numbers === 999) {
                lastEstimatedValue = 5000;
                rewardText = "🔥 КРУТОЙ НОМЕР! (Оценка: $5,000)";
            } else if (numbers % 111 === 0) {
                lastEstimatedValue = 1500;
                rewardText = "✨ ЗЕРКАЛЬНЫЙ! (Оценка: $1,500)";
            } else if (region === "777") {
                lastEstimatedValue = 800;
                rewardText = "🌟 РЕГИОН 777! (Оценка: $800)";
            }

            document.getElementById("spinReward").innerText = rewardText;

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }

            updateUI();
        }

        function saveCurrentPlate() {
            myPlates.push({
                number: lastGeneratedPlate,
                estimatedPrice: lastEstimatedValue
            });
            updateUI();
            alert(`Номер ${lastGeneratedPlate} сохранён в ваши номера!`);
        }

        function renderPlates() {
            const list = document.getElementById('platesList');
            list.innerHTML = '';

            if (myPlates.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); text-align:center;">У вас нет сохраненных номеров</p>';
                return;
            }

            myPlates.forEach((item, index) => {
                list.innerHTML += `
                    <div class="list-item">
                        <div>
                            <div class="small-plate">${item.number}</div>
                            <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">Реком: $${item.estimatedPrice.toLocaleString()}</div>
                        </div>
                        <button class="sell-btn" onclick="sellPlate(${index})">Продать</button>
                    </div>
                `;
            });
        }

        function sellPlate(index) {
            const item = myPlates[index];
            const priceInput = prompt(`За сколько хотите продать номер ${item.number}?`, item.estimatedPrice);

            if (priceInput !== null) {
                const sellPrice = parseInt(priceInput);
                if (isNaN(sellPrice) || sellPrice < 0) {
                    alert("Введите корректную сумму!");
                    return;
                }

                balance += sellPrice;
                myPlates.splice(index, 1);
                updateUI();
                alert(`Вы продали номер ${item.number} за $${sellPrice.toLocaleString()}!`);
            }
        }

        function renderGarage() {
            const list = document.getElementById('garageList');
            list.innerHTML = '';

            ownedCars.forEach(id => {
                const car = cars[id];
                const isCurrent = id === currentCarIndex;
                list.innerHTML += `
                    <div class="list-item">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:1.8rem;">${car.icon}</span>
                            <div>
                                <div><strong>${car.name}</strong></div>
                                <div style="font-size:0.75rem; color:var(--text-muted);">${isCurrent ? 'Активен' : 'В гараже'}</div>
                            </div>
                        </div>
                        ${!isCurrent ? `<button class="select-btn" onclick="selectCar(${id})">Выбрать</button>` : '<span style="color:var(--accent-green); font-weight:bold; font-size:0.85rem;">✓</span>'}
                    </div>
                `;
            });
        }

        function renderShop() {
            const list = document.getElementById('shopList');
            list.innerHTML = '';

            cars.forEach(car => {
                const isOwned = ownedCars.includes(car.id);
                list.innerHTML += `
                    <div class="list-item">
                        <div style="display:flex; align-items:center; gap:10px;">
                            <span style="font-size:1.8rem;">${car.icon}</span>
                            <div>
                                <div><strong>${car.name}</strong></div>
                                <div style="font-size:0.8rem; color:var(--accent-green); font-weight:bold;">$${car.price.toLocaleString()}</div>
                            </div>
                        </div>
                        ${isOwned ? '<span style="color:var(--text-muted); font-size:0.85rem;">Куплено</span>' : `<button class="buy-btn" onclick="buyCar(${car.id})">Купить</button>`}
                    </div>
                `;
            });
        }

        function selectCar(id) {
            currentCarIndex = id;
            updateUI();
            switchTab('game');
        }

        function buyCar(id) {
            const car = cars[id];
            if (balance < car.price) {
                alert("Недостаточно денег на балансе!");
                return;
            }
            balance -= car.price;
            ownedCars.push(id);
            currentCarIndex = id;
            updateUI();
            alert(`Поздравляем! Вы купили ${car.name}!`);
        }

        async function buyWithStars(title, description, amountStars) {
            if (!tg) {
                alert("Откройте игру через Telegram!");
                return;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        payload: `user_donate_${Date.now()}`,
                        provider_token: "",
                        currency: "XTR",
                        prices: [{ label: title, amount: amountStars }]
                    })
                });

                const data = await response.json();

                if (data.ok && data.result) {
                    tg.openInvoice(data.result, function(status) {
                        if (status === 'paid') {
                            balance += 50000;
                            updateUI();
                            tg.showAlert("Спасибо за поддержку! ⭐ Вам зачислено $50,000!");
                        }
                    });
                } else {
                    alert("Ошибка создания счета: " + (data.description || "Ошибка"));
                }
            } catch (err) {
                console.error(err);
                alert("Ошибка сети Telegram.");
            }
        }

        updateUI();
    </script>
</body>
</html>
