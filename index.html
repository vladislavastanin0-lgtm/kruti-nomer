<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Крути Номера — Автомобильная игра</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121316;
            --card-bg: #1c1e24;
            --accent-gold: #f39c12;
            --accent-blue: #3498db;
            --text-color: #ffffff;
            --text-muted: #a0a0a0;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }

        .header {
            width: 100%;
            padding: 15px 20px;
            box-sizing: border-box;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2a2d34;
        }

        .brand-title {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .donate-btn {
            background: linear-gradient(135deg, #f1c40f, #f39c12);
            color: #000;
            border: none;
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(243, 156, 18, 0.3);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .donate-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 5px rgba(243, 156, 18, 0.2);
        }

        .container {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
        }

        .game-card {
            background-color: var(--card-bg);
            width: 100%;
            border-radius: 16px;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            border: 1px solid #2a2d34;
            box-shadow: 0 8px 20px rgba(0,0,0,0.4);
        }

        .number-plate {
            background: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            border-radius: 8px;
            padding: 10px 20px;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin: 20px 0;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            text-transform: uppercase;
            font-family: 'Courier New', Courier, monospace;
        }

        .action-btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .action-btn:active {
            opacity: 0.85;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand-title">🏎️ Крути Номера</div>
        <button class="donate-btn" onclick="buyWithStars('Донат разработчику 🏎️', 'Поддержка проекта Крути Номера', 50)">
            ⭐ 50 Stars
        </button>
    </div>

    <div class="container">
        <div class="game-card">
            <h2 style="margin-top:0;">Испытай удачу!</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Выбей редкий блатный номер для своего авто</p>

            <div class="number-plate" id="plateDisplay">777 AAA 01</div>

            <button class="action-btn" onclick="spinPlate()">Крутить номер</button>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        // ТОКЕН БОТА С ПРАВИЛЬНЫМ СИНТАКСИСОМ
        const BOT_TOKEN = "8977809186:AAF0fqobqVRQf8wbnwApirFl_dwSrHZvxPc";

        // Функция оплаты через Telegram Stars (XTR)
        async function buyWithStars(title, description, amountStars) {
            if (!tg) {
                alert("Пожалуйста, откройте игру внутри Telegram!");
                return;
            }

            try {
                const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/createInvoiceLink`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: title,
                        description: description,
                        payload: `user_donate_${Date.now()}`,
                        provider_token: "", // Для Stars обязательно оставляем ПУСТЫМ
                        currency: "XTR",     // Код Telegram Stars
                        prices: [
                            { label: title, amount: amountStars }
                        ]
                    })
                });

                const data = await response.json();

                if (data.ok && data.result) {
                    // Открываем нативное окно оплаты Telegram Stars
                    tg.openInvoice(data.result, function(status) {
                        if (status === 'paid') {
                            tg.showAlert("Спасибо за поддержку! Звёзды успешно зачислены! ⭐");
                        } else if (status === 'failed') {
                            tg.showAlert("Не удалось завершить оплату.");
                        }
                    });
                } else {
                    alert("Ошибка создания счета: " + (data.description || "Неизвестная ошибка"));
                }
            } catch (err) {
                console.error("Ошибка сети:", err);
                alert("Не удалось связаться с сервером Telegram.");
            }
        }

        // Простая функция прокрутки номеров
        function spinPlate() {
            const letters = "ABEKMHOPCTYX";
            const numbers = Math.floor(100 + Math.random() * 900);
            const randLetters = letters[Math.floor(Math.random() * letters.length)] +
                                letters[Math.floor(Math.random() * letters.length)] +
                                letters[Math.floor(Math.random() * letters.length)];
            const regions = ["01", "02", "05", "13", "17"];
            const region = regions[Math.floor(Math.random() * regions.length)];

            document.getElementById("plateDisplay").innerText = `${numbers} ${randLetters} ${region}`;

            if (tg && tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('medium');
            }
        }
    </script>
</body>
</html>
